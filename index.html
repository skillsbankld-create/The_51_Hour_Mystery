<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 51-Hour Mystery | Skills Bank</title>
<style>
:root{
  --navy:#080928; --navy-2:#1A1C46; --teal:#40BDA9; --teal-ink:#1C7A6C; --teal-bg:#E1F5F1;
  --ice:#EBF4FF; --ice-2:#DDE9F8; --line:#CFDAEA; --line-2:#B8C5D9; --slate:#5D6179; --white:#fff;
  --amber:#C9780F; --amber-2:#E9A23B; --amber-bg:#FDF3E2; --red:#B9433A; --red-bg:#FBEBE9;
  --cs:#40BDA9; --op:#3D63DD; --qa:#8A56CC;
  --font:"Segoe UI","Helvetica Neue",Arial,"Noto Sans","Noto Sans Arabic",Tahoma,sans-serif;
  --radius:4px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{overflow-x:clip;font-family:var(--font);color:var(--navy);background:var(--ice);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
html[lang=ar] body{font-family:"Segoe UI","Noto Sans Arabic","Noto Kufi Arabic","Geeza Pro",Tahoma,Arial,sans-serif;line-height:1.65}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.ico.s{width:15px;height:15px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;padding:10px 24px;min-height:66px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:36px;width:auto;display:block}
.prog{border-inline-start:1px solid var(--line);padding-inline-start:14px;font-size:12px;color:var(--slate);line-height:1.3;white-space:nowrap}
.prog b{display:block;color:var(--navy);font-size:13px;font-weight:700}
.nav{display:flex;justify-content:center;align-items:center;gap:2px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.nav li{display:flex;align-items:center}
.nav li+li::before{content:"";width:18px;height:1px;background:var(--line-2);margin:0 4px}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 8px;border-radius:var(--radius);font-size:13px;color:var(--slate);white-space:nowrap}
.nav button[disabled]{cursor:default}
.nav button[disabled]:not(.cur){opacity:.55}
.nav .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--line-2);background:#fff}
.nav .cur{color:var(--navy);font-weight:700}
.nav .cur .n{background:var(--navy);border-color:var(--navy);color:#fff}
.nav .done .n{background:var(--teal);border-color:var(--teal);color:var(--navy)}
.tools{display:flex;align-items:center;gap:10px}
.evbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--navy);background:#fff;border-radius:var(--radius);padding:7px 12px;font-weight:600;font-size:14px}
.evbtn:hover{background:var(--ice)}
.evbtn .cnt{background:var(--navy);color:#fff;border-radius:10px;min-width:22px;padding:0 6px;font-size:12px;line-height:20px;text-align:center}
.evbtn.pulse .cnt{animation:pulse 1s ease 2}
@keyframes pulse{50%{background:var(--teal);color:var(--navy);transform:scale(1.15)}}
.lang{display:flex;border:1.5px solid var(--line-2);border-radius:var(--radius);overflow:hidden}
.lang button{border:0;background:#fff;padding:6px 11px;font-size:13px;font-weight:700;color:var(--slate)}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff}

/* ---------- layout ---------- */
.wrap{max-width:1300px;margin:0 auto;padding:26px 24px 70px}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:18px;flex-wrap:wrap}
.shead h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.shead p.inst{margin:6px 0 0;font-size:16px;color:var(--navy);max-width:68ch}
.shead p.sub{margin:4px 0 0;font-size:14px;color:var(--slate);max-width:72ch}
.panel{background:#fff;border:1px solid var(--line);border-radius:6px}
.sfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.sfoot .hint{color:var(--slate);font-size:14px;max-width:62ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--radius);padding:10px 18px;font-weight:700;font-size:15px;border:1.5px solid transparent;transition:background .15s,border-color .15s}
.btn-p{background:var(--teal);color:var(--navy);border-color:var(--teal)}
.btn-p:hover{background:#56C9B6}
.btn-p[disabled]{background:var(--ice-2);border-color:var(--ice-2);color:#8A93A8;cursor:not-allowed}
.btn-s{background:#fff;color:var(--navy);border-color:var(--navy)}
.btn-s:hover{background:var(--ice)}
.btn-s[disabled]{opacity:.45;cursor:not-allowed}
.btn-g{background:none;border-color:transparent;color:var(--navy);padding:8px 10px;font-weight:600}
.btn-g:hover{background:var(--ice)}
.btn-g[disabled]{opacity:.4;cursor:not-allowed}
.btn-lg{padding:15px 28px;font-size:17px}

.confirm{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--amber-bg);border:1px solid #EFD3A6;border-radius:var(--radius);padding:12px 16px;margin-top:14px}
.confirm p{margin:0;flex:1;min-width:240px;font-weight:600}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--slate)}
.msg{margin-top:10px;font-size:13px;color:var(--amber);font-weight:600;display:flex;gap:6px;align-items:center}

/* ---------- welcome ---------- */
.welcome{display:grid;grid-template-columns:1.05fr 1fr;gap:0;min-height:560px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#fff}
.cover{position:relative;background:var(--navy);color:#fff;padding:120px 48px 44px;overflow:hidden}
.cover::before,.cover::after{content:"";position:absolute;top:0;width:96px;height:96px;background:var(--teal);clip-path:polygon(0 0,100% 0,0 100%)}
.cover::before{inset-inline-start:0}
.cover::after{inset-inline-start:96px}
html[dir=rtl] .cover::before,html[dir=rtl] .cover::after{clip-path:polygon(0 0,100% 0,100% 100%)}
.cover .case{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--teal)}
.cover h1{margin:10px 0 0;font-size:54px;line-height:1;font-weight:800;letter-spacing:-.015em;text-transform:uppercase}
html[lang=ar] .cover h1{font-size:50px;line-height:1.2;letter-spacing:0}
.cover .tag{margin:16px 0 0;font-size:17px;color:#C9D6EA;max-width:34ch}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:26px;border:1px solid #3B3E6B;border-radius:var(--radius);padding:6px 12px;font-size:13px;color:#fff}
.status i{width:8px;height:8px;border-radius:50%;background:var(--amber-2)}
.memo{margin-top:34px;border-inline-start:3px solid var(--teal);padding-inline-start:18px;color:#DCE5F3;font-size:15px;max-width:52ch}
.memo b{display:block;color:#fff;font-size:13px;margin-bottom:6px}
.memo p{margin:0 0 8px}
.brief{padding:40px 44px;display:flex;flex-direction:column;gap:22px}
.brief h2{margin:0;font-size:24px;font-weight:800;line-height:1.2}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.fact{padding:14px 16px;background:var(--ice)}
.fact+.fact{border-inline-start:1px solid var(--line)}
.fact .v{font-size:30px;font-weight:800;line-height:1.1}
.fact.over .v{color:var(--amber)}
.fact .k{font-size:13px;color:var(--slate)}
.meta2{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:14px;margin:0}
.meta2 dt{color:var(--slate)}
.meta2 dd{margin:0;font-weight:600}
.mission p{margin:4px 0 0}
.mission h3,.objs h3{margin:0;font-size:14px;color:var(--slate);font-weight:600}
.objs ol{list-style:none;padding:0;margin:8px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.objs li{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.objs li .n{width:26px;height:26px;border-radius:var(--radius);background:var(--navy);color:var(--teal);display:grid;place-items:center;font-size:13px}
.objs li+li::before{content:"";width:22px;height:2px;background:var(--line-2)}
.gemba{font-size:13px;color:var(--slate);margin-top:auto}

/* ---------- stage 1 ---------- */
.budget{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 16px}
.budget .lbl{font-size:13px;color:var(--slate);line-height:1.2}
.budget .num{font-size:26px;font-weight:800;line-height:1}
.budget .num small{font-size:15px;color:var(--slate);font-weight:600}
.pips{display:flex;gap:4px}
.pips i{width:12px;height:22px;border-radius:2px;background:var(--teal)}
.pips i.u{background:var(--ice-2)}
.depts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.dtile{text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.dtile:hover{border-color:var(--line-2)}
.dtile[aria-pressed=true]{border-color:var(--navy);box-shadow:inset 0 -3px 0 var(--teal)}
.av{grid-row:span 2;width:40px;height:40px;border-radius:var(--radius);background:var(--navy);color:var(--teal);display:grid;place-items:center;font-weight:800;font-size:14px}
.dtile .dn{font-weight:800;font-size:16px}
.dtile .pp{font-size:13px;color:var(--slate)}
.dcount{grid-row:span 2;text-align:end;font-size:12px;color:var(--slate);line-height:1.3}
.dcount .bars{display:flex;gap:3px;justify-content:flex-end;margin-bottom:4px}
.dcount .bars i{width:16px;height:6px;border-radius:2px;background:var(--ice-2)}
.dcount .bars i.on{background:var(--navy)}
.dcount .need{color:var(--amber);font-weight:700}
.desk{display:grid;grid-template-columns:1fr 1.1fr;gap:16px;align-items:start}
.qpanel{padding:16px}
.qpanel h3,.apanel h3{margin:0 0 10px;font-size:14px;color:var(--slate);font-weight:600}
.qlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.q{width:100%;text-align:start;display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:11px 13px;font-size:15px;line-height:1.4}
.q:hover{border-color:var(--line-2);background:#FAFCFF}
.q .rd{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);flex:none;margin-top:2px}
.q[aria-checked=true]{border-color:var(--navy);background:var(--ice)}
.q[aria-checked=true] .rd{border:5px solid var(--navy)}
.q.asked{background:#F7FAFE}
.q.asked .rd{border:0;background:none;color:var(--teal-ink)}
.q.viewing{border-color:var(--teal)}
.q .st{display:block;font-size:12px;color:var(--teal-ink);font-weight:700;margin-top:3px}
.q.blocked:not(.asked){color:#8A93A8}
.askbar{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.askbar .note{flex:1;min-width:200px}
.apanel{padding:18px 20px;min-height:320px}
.who{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.who .av{grid-row:auto;color:var(--teal)}
.who b{display:block;font-size:15px}
.who span{font-size:13px;color:var(--slate)}
.asked-q{font-weight:700;font-size:16px;margin:0 0 10px;padding-inline-start:12px;border-inline-start:3px solid var(--line-2)}
.ans{margin:0 0 16px;font-size:15.5px;max-width:64ch}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:3px}
.chip.rec{background:var(--teal-bg);color:var(--teal-ink)}
.chip.ins{background:var(--ice);color:var(--slate);border:1px solid var(--line)}
.found{display:flex;align-items:center;gap:12px;justify-content:space-between;border:1px solid var(--line);border-inline-start:4px solid var(--teal);border-radius:var(--radius);padding:10px 14px;background:#fff;flex-wrap:wrap}
.found b{font-size:15px}
.found .note{margin-top:2px}
.empty{color:var(--slate);display:grid;place-items:center;text-align:center;min-height:260px;gap:10px}
.empty .ico{width:34px;height:34px;color:var(--line-2)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,9,40,.28);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(470px,100%);background:#fff;z-index:51;display:flex;flex-direction:column;transform:translateX(105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;box-shadow:-8px 0 30px rgba(8,9,40,.15)}
html[dir=rtl] .drawer{transform:translateX(-105%)}
.drawer.open{transform:none!important;visibility:visible;transition:transform .25s ease}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:18px;font-weight:800}
.dtabs{display:flex;border-bottom:1px solid var(--line);padding:0 12px}
.dtabs button{border:0;background:none;padding:12px 10px;font-weight:600;font-size:14px;color:var(--slate);border-bottom:3px solid transparent;margin-bottom:-1px}
.dtabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--teal)}
.dbody{flex:1;overflow:auto;padding:16px 18px 30px}
.dlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ditem{width:100%;text-align:start;display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;background:#fff}
.ditem:hover{border-color:var(--navy)}
.ditem .ico{color:var(--teal-ink)}
.ditem small{display:block;color:var(--slate);font-size:12px}
.insight{border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;background:#FAFCFF}
.insight .src{font-size:12px;color:var(--slate);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.insight p{margin:0;font-size:14px}
.disc{font-size:13px;color:var(--slate);margin:0 0 12px}

/* evidence document */
.doc{border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;background:#fff;font-size:14px}
.doc .dh{background:var(--navy);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-size:12px}
.doc .dh b{color:var(--teal);letter-spacing:.04em}
.doc h3{margin:0;padding:12px 14px 4px;font-size:17px;font-weight:800}
.doc .dsub{padding:0 14px 10px;font-size:12px;color:var(--slate);border-bottom:1px solid var(--line)}
.doc dl{display:grid;grid-template-columns:minmax(120px,40%) 1fr;margin:0;padding:6px 14px}
.doc dt,.doc dd{padding:6px 0;border-bottom:1px dashed var(--line);margin:0}
.doc dt{color:var(--slate);padding-inline-end:10px}
.doc dd{font-weight:600}
.doc table{width:100%;border-collapse:collapse;margin:4px 0 6px}
.doc th{font-size:11px;color:var(--slate);text-align:start;font-weight:600;padding:6px 14px;background:var(--ice)}
.doc td{padding:7px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.doc td:first-child{white-space:nowrap;font-weight:700;width:1%}
.doc ol{margin:8px 0;padding-inline-start:34px;padding-inline-end:14px}
.doc ol li{margin:5px 0}
.doc .intro{padding:10px 14px 0;margin:0}
.doc .dn{margin:6px 14px 14px;padding:9px 12px;background:var(--ice);border-radius:3px;font-weight:600}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:var(--radius);display:flex;align-items:center;gap:10px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:all .25s;max-width:min(560px,90vw)}
.toast .ico{color:var(--teal)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- stepper ---------- */
.stepper{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--slate);padding:6px 12px 6px 6px;border-radius:var(--radius);background:#fff;border:1px solid var(--line)}
html[dir=rtl] .stepper li{padding:6px 6px 6px 12px}
.stepper .n{width:22px;height:22px;border-radius:3px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--ice-2)}
.stepper .cur{color:var(--navy);font-weight:700;border-color:var(--navy)}
.stepper .cur .n{background:var(--navy);color:#fff}
.stepper .done .n{background:var(--teal);color:var(--navy)}
.how{background:#fff;border:1px dashed var(--line-2);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;font-size:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.how .mini{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.how .mini span{border:1.5px solid var(--line-2);border-radius:3px;padding:3px 8px;background:var(--ice);font-weight:600;font-size:13px}
.how .mini .ret{border-color:var(--amber-2);background:var(--amber-bg)}

/* ---------- map ---------- */
.mapwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px 20px 24px}
.map{position:relative;min-width:1060px}
.mrow{display:grid;grid-template-columns:52px repeat(6,minmax(0,1fr)) 52px;column-gap:28px;align-items:stretch;position:relative;z-index:1}
.rrow{margin-top:58px;align-items:start}
.exzone{margin-top:30px;padding:40px 0 12px;border-top:1px dashed var(--line-2);background:linear-gradient(#FFFAF2,#FFFAF2) no-repeat;position:relative}
.zonelbl{font-size:13.5px;font-weight:800;color:var(--navy);margin:0 0 10px}
.exzone .zonelbl.ex{position:absolute;top:10px;inset-inline-start:12px;color:#8A520A;margin:0;font-size:13.5px}
.exhelp{display:flex;gap:12px;margin:22px 12px 4px;padding:12px 16px;background:#fff;border:1px solid #EFD3A6;border-radius:var(--radius);font-size:14px;color:var(--navy)}
.exhelp>.ico{color:var(--amber);margin-top:2px}
.exhelp p{margin:0}
.exhelp ol{margin:4px 0 8px;padding-inline-start:22px;font-weight:700}
.exhelp .exex{color:var(--slate);font-size:13px;border-top:1px dashed #EFD3A6;padding-top:8px}
.pathread{margin:2px 0 0;font-size:12.5px;font-weight:700;color:var(--navy);background:var(--amber-bg);border-radius:3px;padding:5px 7px}
.pathread.open{font-weight:500;color:var(--slate);background:none;padding:0}
.exzone .rrow{margin-top:0}
.exzone .rrow+.rrow{margin-top:30px}
.rrow>*{grid-row:1}
.lanetag{align-self:center;justify-self:center;display:flex;align-items:center;gap:3px;color:var(--amber);font-size:13px}
.lanepanel{background:#fff;border:1px solid #EFD3A6;border-radius:var(--radius);padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--slate)}
.lanepanel .lp-h{font-weight:800;color:var(--amber);font-size:12.5px}
.lanepanel label{display:flex;flex-direction:column;gap:3px;font-weight:600;color:var(--navy);font-size:12.5px;line-height:1.35}
.lanepanel select{font-size:13px;padding:5px 6px;border:1px solid var(--line-2);border-radius:3px;background:#fff;color:var(--navy);width:100%}
.lanepanel .stale{margin:0;color:var(--amber);font-weight:600;display:flex;gap:4px}
.slot.exslot{border-color:var(--amber-2);background:#fff;color:var(--amber);min-height:122px}
.slot.view{cursor:default;background:#fff;color:var(--slate)}
.mc .cap.muted{color:var(--slate);font-style:italic}
.checklist{padding:14px 18px;margin-top:14px}
.checklist h3{margin:0 0 8px;font-size:15px;font-weight:800}
.checklist ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 22px}
.checklist li{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.checklist li b{margin-inline-start:auto;white-space:nowrap}
.checklist li span{color:var(--amber);display:flex}
.checklist li.ok span{color:var(--navy)}
.seltool .loc{color:var(--slate);font-size:13px;margin-inline-end:8px}
.se{align-self:center;height:44px;border-radius:22px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;text-align:center;line-height:1.1;padding:0 4px}
.mc{position:relative;background:#fff;border:2px solid var(--line-2);border-radius:var(--radius);padding:10px 10px 9px;min-height:122px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s;text-align:start}
.mc.clk{cursor:pointer}

.flag{font-size:11px;font-weight:700;color:var(--red);background:var(--red-bg);border-radius:3px;padding:2px 6px}
.mc.f-pos,.mc.f-own{outline:2px dashed var(--red);outline-offset:3px}
.dsel{width:100%;font-size:12px;padding:5px 4px;border:1px solid var(--line-2);border-radius:3px;background:#fff;color:var(--navy)}
.slot{border:2px dashed var(--line-2);border-radius:var(--radius);min-height:122px;display:grid;place-items:center;color:var(--slate);font-size:12.5px;text-align:center;padding:8px;background:#F6F9FE;cursor:pointer}

.ghost{border:2px dashed var(--amber-2);border-radius:var(--radius);min-height:80px;display:grid;place-items:center;font-size:12.5px;color:var(--amber);padding:8px;text-align:center;background:#fff}

.seltool{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;background:var(--ice);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:14px}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;background:#fff}

.tray{margin-top:16px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:6px}

.cards{display:flex;gap:12px;flex-wrap:wrap;min-height:70px}
.tc{width:178px;text-align:start;background:#fff;border:2px solid var(--line-2);border-radius:var(--radius);padding:12px;font-weight:700;font-size:14px;line-height:1.3;cursor:grab;min-height:70px}
.tc:hover{border-color:var(--navy);background:#FAFCFF}

.edit-tools{display:flex;gap:6px}

.retcfg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.rc{background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--amber-2);border-radius:var(--radius);padding:14px 16px}
.rc h3{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.rc .f{display:grid;grid-template-columns:minmax(150px,42%) 1fr;gap:6px 12px;align-items:center;margin-bottom:8px;font-size:14px}

/* ---------- stage 3 ---------- */
.flowline{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--slate);flex-wrap:wrap}
.flowline span{font-weight:700;color:var(--navy)}
.rgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px;align-items:start}
.rform{padding:16px 18px}
.rform h3,.rlist h3{margin:0 0 12px;font-size:16px;font-weight:800}

.cats{display:flex;gap:6px;flex-wrap:wrap}
.cat{border:1.5px solid var(--line-2);background:#fff;border-radius:3px;padding:6px 11px;font-size:13.5px;font-weight:600}

.ev:hover{border-color:var(--line-2)}
.ev input{margin-top:3px;accent-color:var(--navy)}
.ev small{display:block;color:var(--slate);font-size:12px}
.ev.vf{border-style:dashed;border-color:var(--amber-2);background:var(--amber-bg)}

.rlist{padding:16px 18px}
.rcount{font-size:14px;color:var(--slate);margin-bottom:10px}

.ri{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start}
.ri .mk{grid-row:span 2}
.ri b{font-size:14px}
.ri small{grid-column:2;color:var(--slate);font-size:12.5px}
.ri .acts{grid-row:span 2;display:flex;gap:2px}
.pickprompt{display:flex;gap:12px;align-items:center;color:var(--slate);min-height:150px;justify-content:center;text-align:center;padding:20px}

/* ---------- stage 4 ---------- */
.rv-hero{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end;margin-bottom:20px}
.rv-hero h2{margin:0;font-size:40px;font-weight:800;letter-spacing:-.015em;line-height:1.05;text-transform:uppercase}

.rv-hero p{margin:8px 0 0;font-size:17px;color:var(--slate)}
.trio{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.trio div{padding:10px 22px;text-align:center}
.trio div+div{border-inline-start:1px solid var(--line)}
.trio b{display:block;font-size:34px;font-weight:800;line-height:1.1}
.trio span{font-size:13px;color:var(--slate)}
.trio .ov b{color:var(--amber)}
.sec{margin-top:26px}

.tl{padding:22px 22px 18px}
.bar{position:relative;display:flex;height:64px;border-radius:4px;overflow:visible;background:var(--ice)}
.bar .sg{position:relative;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;font-size:12.5px;font-weight:800;white-space:nowrap;transition:flex-grow 0s}
.bar .sg+.sg{border-inline-start:2px solid #fff}
.sg.q1,.sg.q2{background:var(--amber)}
.sg.q2{background:#A9620B}
.sg.cust{background:#8E97AD}

.sg span{padding:0 6px}
.bar.anim .sg{animation:grow .9s cubic-bezier(.3,.7,.2,1) both}
@keyframes grow{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
html[dir=rtl] .bar.anim .sg{animation-name:growr}
@keyframes growr{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
.sla{position:absolute;top:-14px;bottom:-26px;width:0;border-inline-start:2px dashed var(--navy);z-index:2}
.sla span{position:absolute;bottom:-2px;inset-inline-start:6px;font-size:12px;font-weight:800;white-space:nowrap;background:#fff;padding:0 4px}
.axis{position:relative;height:42px;margin-top:6px;font-size:12px;color:var(--slate)}
.axis .tk{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
html[dir=rtl] .axis .tk{transform:translateX(50%)}
.axis .day{position:absolute;top:20px;font-weight:700;color:var(--navy);border-inline-start:1px solid var(--line-2);padding-inline-start:6px;font-size:12px}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.lg{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center}
.lg i{width:14px;height:14px;border-radius:2px;grid-row:span 3}
.lg b{font-size:20px;font-weight:800;line-height:1.2}
.lg span{font-size:13px;line-height:1.3}
.lg small{font-size:12px;color:var(--slate)}
.lg.hot{border-color:var(--amber-2);background:var(--amber-bg)}
.lgtot{display:flex;justify-content:flex-end;gap:8px;font-size:14px;margin-top:8px;color:var(--slate)}
.lgtot b{color:var(--navy)}
.keyrev{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;padding:14px 16px;border-radius:var(--radius);background:var(--navy);color:#fff}
.keyrev .big{grid-row:span 2;font-size:34px;font-weight:800;color:var(--amber-2);line-height:1}
.keyrev p{margin:0;font-size:16px;font-weight:600}
.keyrev small{color:#B9C6DD;font-size:13px}
.slafact{margin:10px 0 0;font-size:14px;color:var(--slate)}
.mapgrid{display:flex;flex-direction:column;gap:14px}
.mapgrid>*{min-width:0}
.cdet{padding:16px 20px;display:grid;grid-template-columns:minmax(200px,1fr) 1.4fr 1fr;gap:6px 26px;align-items:start}
.cdet .hd{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
.cdet h5:first-child{margin-top:0}
.cdet h4{margin:0 0 4px;font-size:17px;font-weight:800}
.cdet .hd .own{font-size:13px;color:var(--slate)}
.cdet h5{margin:12px 0 4px;font-size:13px;color:var(--slate);font-weight:600}
.cdet p{margin:0;font-size:14px}
.evrow{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.evrow .y{color:var(--teal-ink);font-weight:700;white-space:nowrap}
.evrow .n{color:var(--slate);white-space:nowrap}
.rbox{border-inline-start:3px solid var(--amber-2);padding:6px 10px;background:var(--amber-bg);margin-top:6px;border-radius:2px}
.rbox b{font-size:14px;display:block}
.rbox p{font-size:13.5px}
.skipnote{margin-top:12px;display:flex;gap:10px;font-size:13.5px;color:var(--slate);background:#fff;border:1px dashed var(--line-2);border-radius:var(--radius);padding:10px 14px}
.mylegend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.misslist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.misslist div{font-size:13.5px;color:var(--red);font-weight:600;display:flex;gap:6px;align-items:center}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fcol{background:#fff;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:6px;padding:14px 16px}
.fcol.ms{border-top-color:var(--red)}
.fcol.evd{border-top-color:var(--amber-2)}
.fcol h4{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.fcol ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.fcol li{font-size:14.5px;line-height:1.45}
.fcol li+li{border-top:1px dashed var(--line);padding-top:10px}
.fcol .lead{font-weight:600}
.myrisks{margin-top:14px;padding:14px 16px}
.myrisks h4{margin:0 0 8px;font-size:15px;font-weight:800}
.mr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.mr small{grid-column:2;color:var(--slate);font-size:13px}
.closing{margin-top:30px;background:var(--navy);color:#fff;border-radius:6px;padding:28px 32px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.closing::after{content:"";position:absolute;inset-inline-end:0;top:0;width:70px;height:70px;background:var(--teal);clip-path:polygon(0 0,100% 0,100% 100%)}

.closing p{margin:0;font-size:22px;font-weight:800;line-height:1.3;max-width:40ch}
.closing ol{list-style:none;margin:10px 0 0;padding:0;display:flex;gap:18px;flex-wrap:wrap;color:#C9D6EA;font-size:15px}
.closing ol b{color:var(--teal)}
.restart{color:#fff;border-color:#fff;background:transparent}
.restart:hover{background:var(--navy-2)}

@media (max-width:1100px){
  .top{grid-template-columns:auto auto;grid-template-areas:"b t" "n n"}
  .brand{grid-area:b}.tools{grid-area:t;justify-content:flex-end}.navw{grid-area:n}
  .welcome{grid-template-columns:1fr}
  .cdet{grid-template-columns:1fr}
  .legend{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .desk,.rgrid,.retcfg,.fgrid{grid-template-columns:1fr}
  .depts{grid-template-columns:1fr}
  .prog{display:none}
  .nav button .lb{display:none}
  .cover{padding:110px 26px 30px}.cover h1{font-size:40px}
  .brief{padding:26px}
  .rv-hero{grid-template-columns:1fr}
  .rv-hero h2{font-size:30px}
  .closing{grid-template-columns:1fr}
}
@media (max-width:820px){
  .toast{left:12px;right:12px;bottom:12px;transform:translateY(20px);max-width:none;font-size:14px}
  .toast.show{transform:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- results v3 ---------- */
.results .rh{margin:0 0 14px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
.rh .num{width:28px;height:28px;border-radius:var(--radius);background:var(--navy);color:var(--teal);display:grid;place-items:center;font-size:14px;flex:none}

.rsec{padding:20px 22px}
.results>.rsec{margin-top:16px}
.rsec .lead{margin:-4px 0 12px;font-size:15px;font-weight:600}
.rchip{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:3px 9px;border-radius:3px;white-space:nowrap;flex:none}
.rchip.ok{background:var(--teal-bg);color:var(--teal-ink)}
.rchip.warn{background:var(--amber-bg);color:#8A520A}

.mrl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.rnote.ok{color:var(--teal-ink)} .rnote.warn{color:#8A520A} .rnote.bad{color:var(--red)}
.excard{border:1px solid var(--line);border-inline-start:4px solid var(--amber-2);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.exhd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.exhd h4{margin:0;font-size:15px;font-weight:800;display:flex;gap:6px;align-items:center}
.excard dl{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:6px 14px;margin:0;font-size:14px}

.excard dd{margin:0}
.rk2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rk2 h5,.tips h5{margin:0 0 8px;font-size:14px;color:var(--slate);font-weight:700;display:flex;gap:6px;align-items:center}
.rkl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rkl li{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px}
.rkl li.none{color:var(--slate)}
.rkl .at{font-size:12.5px;color:var(--slate)}
.rkl small{display:block;color:var(--slate);font-size:13px;margin-top:2px}
.tips{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.tips ul{margin:0;padding-inline-start:20px;font-size:14px}
.tips li{margin:4px 0}
.opl{margin:0;padding-inline-start:20px;font-size:15px;display:flex;flex-direction:column;gap:8px}
@media (max-width:980px){.rgrid2,.rk2{grid-template-columns:1fr}}

/* sticky, compact card tray while mapping */
html{scroll-padding-top:84px}

/* ===================== state ===================== */
const KEY = 'ps4821-state-v2';
const fresh = () => ({
  lang:'en', stage:0, maxStage:0,
  dept:'cs', selQ:null, viewQ:null, asked:[],
  map:{main:[null,null,null,null,null,null], dept:{}, conf:{}, ret:[{trigger:null,act:null,back:null},{trigger:null,act:null,back:null}], view:'edit', submitted:false},
  sel:null, armed:null, undo:[], how:false, confirm:null, note:null,
  risks:[], draft:null, rseq:1,
  revealed:false, rview:'actual', rcard:'B', details:false, animDone:false,
  drawer:{open:false, tab:'docs', doc:null}
});
let state;
try { const s = sessionStorage.getItem(KEY); state = s ? Object.assign(fresh(), JSON.parse(s)) : fresh(); } catch(e){ state = fresh(); }
function save(){ try { sessionStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

const unlockedDocs = () => state.asked.map(id=>QMAP[id].doc).filter(Boolean);
const insights = () => state.asked.filter(id=>!QMAP[id].doc);
const countIn = d => state.asked.filter(id=>QMAP[id].dept===d).length;
const remaining = () => BUDGET - state.asked.length;
function canAsk(d){
  const rem = remaining();
  if(rem<=0) return {ok:false, why:'none'};
  if(countIn(d)>=DEPT_MAX) return {ok:false, why:'max'};
  const need = DEPTS.filter(x=>x!==d && countIn(x)===0);
  if(rem-1 < need.length) return {ok:false, why:'reserve', need};
  return {ok:true};
}
const allDeptsCovered = () => DEPTS.every(d=>countIn(d)>=1);

    return `<li><button class="${cls}" data-act="nav" data-i="${i}" ${navAllowed(i)&&i!==state.stage?'':'disabled'} ${i===state.stage?'aria-current="step"':''}><span class="n">${cls==='done'?ico('check','s'):i+1}</span><span class="lb">${n}</span></button></li>`;

  const nEv = unlockedDocs().length + insights().length;

}

/* ===================== stage 1: investigation ===================== */
function s1HTML(){
  const lg = LG(), d = state.dept, rem = remaining();
  const pips = Array.from({length:BUDGET},(_,i)=>`<i class="${i<rem?'':'u'}"></i>`).join('');
  const tiles = DEPTS.map(k=>{
    const n = countIn(k);
    const bars = Array.from({length:DEPT_MAX},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('');
    const status = n===0 ? `<span class="need">${t('needOne')}</span>` : n>=DEPT_MAX ? t('maxed') : `${t('askedN',{n})} (${t('maxN')})`;
    return `<button class="dtile" data-act="dept" data-v="${k}" aria-pressed="${k===d}">
      <span class="av">${DEPT[k].init[lg]}</span><span class="dn">${dn(k)}</span>
      <span class="dcount"><span class="bars">${bars}</span>${status}</span>
      <span class="pp">${DEPT[k].person[lg]}${cm()}${DEPT[k].role[lg]}</span></button>`;
  }).join('');
  const qs = QUESTIONS.filter(q=>q.dept===d);
  const ca = canAsk(d);
  const list = qs.map(q=>{
    const asked = state.asked.includes(q.id);
    const cls = ['q', asked?'asked':'', state.viewQ===q.id?'viewing':'', (!asked && !ca.ok)?'blocked':''].join(' ');
    return `<li><button class="${cls}" role="radio" aria-checked="${state.selQ===q.id}" data-act="selq" data-v="${q.id}">
      <span class="rd">${asked?ico('check','s'):''}</span><span>${tx(q.q)}${asked?`<span class="st">${t('askedLbl')}</span>`:''}</span></button></li>`;
  }).join('');
  let why = '';
  if(!ca.ok){
    if(ca.why==='none') why = t('whyNone');
    else if(ca.why==='max') why = t('whyMax');
    else why = t('whyReserve',{depts: ca.need.map(x=>dn(x)).join(lg==='ar'?' و':' and ')});
  }
  const canPress = ca.ok && state.selQ && !state.asked.includes(state.selQ);
  const askbar = `<div class="askbar">
    <button class="btn btn-p" data-act="ask" ${canPress?'':'disabled'}>${ico('search')} ${t('askBtn')}</button>
    <span class="note">${!ca.ok ? `<span style="color:var(--amber);font-weight:600">${why}</span>` : (state.selQ && !state.asked.includes(state.selQ) ? t('usesOne',{n:rem}) : t('pickFirst'))}</span></div>`;

  /* answer panel */
  let ans;
  const vq = state.viewQ && QMAP[state.viewQ] && QMAP[state.viewQ].dept===d ? QMAP[state.viewQ] : null;
  if(vq){
    const P = DEPT[vq.dept];
    const tag = vq.doc
      ? `<div class="found"><div><span class="chip rec">${ico('doc','s')} ${t('tagRecord')}</span><div style="margin-top:6px"><b>${docn(vq.doc)}</b></div><div class="note">${t('recNote')}</div></div><button class="btn btn-s" data-act="opendoc" data-v="${vq.doc}">${t('openRecord')}</button></div>`
      : `<div><span class="chip ins">${ico('chat','s')} ${t('tagInsight')}</span><p class="note" style="margin:8px 0 0">${t('insNote')}</p></div>`;
    ans = `<div class="who"><span class="av">${P.init[lg]}</span><div><b>${P.person[lg]}</b><span>${P.role[lg]}${cm()}${dn(vq.dept)}</span></div></div>
      <p class="asked-q">${tx(vq.q)}</p><p class="ans">${tx(vq.a)}</p>${tag}`;
  } else {
    ans = `<div class="empty">${ico('chat')}<div>${t('ansEmpty',{name:DEPT[d].person[lg]})}</div></div>`;
  }

  const covered = allDeptsCovered();
  const primaryCont = covered && rem===0;
  return `<section>
  <div class="shead"><div><h2>${t('s1t')}</h2><p class="inst">${t('s1i')}</p><p class="sub">${t('s1s')}</p></div>
    <div class="budget" aria-live="polite"><div><div class="lbl">${t('remaining')}</div><div class="num">${rem} <small>/ ${BUDGET}</small></div></div><div class="pips" aria-hidden="true">${pips}</div></div></div>
  <div class="depts" role="group">${tiles}</div>
  <div class="desk">
    <div class="panel qpanel"><h3>${t('qsFor',{name:DEPT[d].person[lg]})}</h3><ul class="qlist" role="radiogroup">${list}</ul>${askbar}</div>
    <div class="panel apanel" aria-live="polite">${ans}</div>
  </div>
  <div class="sfoot"><span class="hint">${!covered ? t('needDepts') : rem>0 ? t('leftNote',{n:rem}) : ''}</span>
    <button class="btn ${primaryCont?'btn-p':'btn-s'}" data-act="toS2" ${covered?'':'disabled'}>${t('toMap')}</button></div>
  </section>`;
}
function askQuestion(){
  const q = QMAP[state.selQ]; if(!q || state.asked.includes(q.id)) return;
  if(!canAsk(q.dept).ok) return;
  state.asked.push(q.id); state.viewQ = q.id; state.selQ = null;
  render();
  if(q.doc){ toast(`${t('toastNew')}: ${docn(q.doc)}`); const b=$('#evbtn'); if(b){ b.classList.add('pulse'); setTimeout(()=>b.classList.remove('pulse'),2100);} }
}

/* ===================== evidence drawer ===================== */
function docHTML(id){
  const D = DOCS[id];
  let h = `<article class="doc"><div class="dh"><span>PulseServe${cm()}${dn(D.dept)}</span><b class="ltr">${D.code}</b></div>
    <h3>${tx(D.title)}</h3><div class="dsub">${t('caseL')} <span class="ltr">PS-4821</span>${cm()}${t('verified')}</div>`;
  if(D.intro) h += `<p class="intro">${tx(D.intro)}</p>`;
  if(D.list) h += `<ol>${D.list.map(x=>`<li>${tx(x)}</li>`).join('')}</ol>`;
  if(D.meta) h += `<dl>${D.meta.map(([k,v])=>`<dt>${tx(k)}</dt><dd>${tx(v)}</dd>`).join('')}</dl>`;
  if(D.rows) h += `<table><thead><tr><th>${t('time')}</th><th>${t('entry')}</th></tr></thead><tbody>${D.rows.map(([a,b])=>`<tr><td>${tx(a)}</td><td>${tx(b)}</td></tr>`).join('')}</tbody></table>`;
  if(D.note) h += `<div class="dn">${tx(D.note)}</div>`;
  return h + `</article>`;
}
function renderDrawer(){
  const dr = state.drawer, lg = LG();
  const docs = unlockedDocs(), ins = insights();
  let body;
  if(dr.doc && docs.includes(dr.doc)){
    body = `<button class="btn btn-g" data-act="dback" style="margin-bottom:10px">${ico(lg==='ar'?'right':'left','s')} ${t('back')}</button>${docHTML(dr.doc)}`;
  } else if(dr.tab==='docs'){
    body = docs.length ? `<ul class="dlist">${docs.map(id=>`<li><button class="ditem" data-act="opendoc" data-v="${id}">${ico('doc')}<span><b>${docn(id)}</b><small>${dn(DOCS[id].dept)}${cm()}<span class="ltr">${DOCS[id].code}</span></small></span></button></li>`).join('')}</ul>`
      : `<div class="empty" style="min-height:200px">${ico('doc')}<div>${t('noDocs')}</div></div>`;
  } else {
    body = ins.length ? `<p class="disc">${t('insDisc')}</p><ul class="dlist">${ins.map(id=>{const q=QMAP[id];return `<li class="insight"><div class="src"><span>${DEPT[q.dept].person[lg]}${cm()}${dn(q.dept)}</span><span class="chip ins">${t('tagInsight')}</span></div><p>${tx(q.ins)}</p></li>`;}).join('')}</ul>`
      : `<div class="empty" style="min-height:200px">${ico('chat')}<div>${t('noIns')}</div></div>`;
  }
  $('#drawer').innerHTML = `<div class="dhead"><h2 id="dtitle">${t('dTitle')}</h2><button class="btn btn-g" data-act="dclose" aria-label="${t('close')}">${ico('x')}</button></div>
    <div class="dtabs" role="tablist"><button role="tab" aria-selected="${dr.tab==='docs'}" data-act="dtab" data-v="docs">${t('dDocs')} (${docs.length})</button><button role="tab" aria-selected="${dr.tab==='ins'}" data-act="dtab" data-v="ins">${t('dIns')} (${ins.length})</button></div>
    <div class="dbody">${body}</div>`;
  $('#drawer').classList.toggle('open', dr.open);
  $('#drawer').setAttribute('aria-hidden', !dr.open);
  $('#scrim').classList.toggle('open', dr.open);
}

/* ===================== slot model =====================
   Eight slots: 'm:0'..'m:5' (main journey) and 'r:0','r:1' (exception activities).
   Each exception also stores its own trigger and return step (card IDs). These are kept
   even if those cards move, and are only drawn while they sit in the main journey.     */
const M = () => state.map;
const SLOTS = ['m:0','m:1','m:2','m:3','m:4','m:5','r:0','r:1'];
function getS(s){ const [k,i]=s.split(':'); return k==='m' ? M().main[+i] : M().ret[+i].act; }
function setS(s,id){ const [k,i]=s.split(':'); if(k==='m') M().main[+i]=id; else M().ret[+i].act=id; }
const whereIs = id => SLOTS.find(s=>getS(s)===id) || null;
const placedCards = () => SLOTS.map(getS).filter(Boolean);
const mapCards = placedCards;
const validIn = id => !!id && M().main.includes(id);
const effRet = () => M().ret.map(r=>({act:r.act, trigger: validIn(r.trigger)?r.trigger:null, back: validIn(r.back)?r.back:null}));

function snap(){ state.undo.push(JSON.stringify(state.map)); if(state.undo.length>80) state.undo.shift(); }
function placeFromTray(id, target){
  let s = target || state.armed || SLOTS.find(x=>!getS(x));
  if(!s){ state.note='trayFull'; render(); return; }
  snap();
  const from = whereIs(id), cur = getS(s);
  if(from){ setS(from, cur||null); }
  setS(s, id);
  state.armed=null; state.sel=null; state.note=null; render();
}
function moveSlot(from, to){
  if(from===to) return; snap();
  const a=getS(from), b=getS(to); setS(to,a); setS(from,b||null);
  state.sel=null; state.armed=null; render();
}
function toTray(s){ if(!getS(s)) return; snap(); setS(s,null); state.sel=null; render(); }
function completeness(){
  const m=M(), e=effRet();
  const placed = placedCards();
  const c = {main:m.main.filter(Boolean).length, ex:m.ret.filter(r=>r.act).length,
    trig:e.filter(r=>r.act&&r.trigger).length, back:e.filter(r=>r.act&&r.back).length,
    own:placed.filter(id=>m.dept[id]).length, ownOf:placed.length};
  c.missing = (6-c.main)+(2-c.ex)+(c.ex-c.trig)+(c.ex-c.back)+(c.ownOf-c.own);
  return c;
}

/* ===================== process map renderer =====================
   o = {main, ret, dept, conf, mode:'edit'|'view', clickAct, sel, flags, extra}           */
function mapHTML(o){
  const ids = o.main, edit = o.mode==='edit';
  let h = `<div class="map ${edit?'editing':''}" data-map>`;
  if(edit) h += `<div class="zonelbl">${t('mainLbl')}</div>`;
  h += `<div class="mrow mainrow"><div class="se" data-node="s">${t('startN')}</div>`;
  ids.forEach((id,i)=>{ h += id ? cardHTML(id,o,{slot:'m:'+i, node:i}) : slotHTML('m:'+i,o,i); });
  h += `<div class="se" data-node="e">${t('endN')}</div></div>`;
  if(edit) h += `<div class="exzone"><div class="zonelbl ex">${t('exLbl')}</div>`;
  let h0 = h;
  /* read-only views: exceptions share one lane unless their columns collide */
  const used = [];
  const rowOf = (k,col) => { if(edit) return k; let r=0; while(used[r] && used[r].includes(col)) r++; (used[r]=used[r]||[]).push(col); return r; };
  const laneHTML = {};
  (o.ret||[]).forEach((r,k)=>{
    if(!edit && !r.act) return;
    const ti = r.trigger && ids.includes(r.trigger) ? ids.indexOf(r.trigger) : null;
    const bi = r.back && ids.includes(r.back) ? ids.indexOf(r.back) : null;
    const col = ti===null ? 0 : ti;
    let h = '';
    if(edit) h += `<div class="lanetag" style="grid-column:1" title="${t('exN',{n:k+1})}">${ico('ret','s')}<b>${k+1}</b></div>`;
    h += `<div class="rcell" style="grid-column:${col+2}" data-lane="${k}" data-trig="${ti===null?'':ti}" data-back="${bi===null?'':bi}">` +
      (r.act ? cardHTML(r.act,o,{slot:'r:'+k, lane:r, ti}) : slotHTML('r:'+k,o,null)) + `</div>`;
    if(edit){
      const pc = col>=2 ? `${col} / span 2` : `${col+3} / span 2`;
      const opts = (v,ph) => `<option value="">${ph}</option>` + ids.filter(Boolean).map(id=>`<option value="${id}" ${v===id?'selected':''}>${cn(id)}</option>`).join('');
      const stale = (r.trigger && ti===null) || (r.back && bi===null);
      const read = (r.act && ti!==null && bi!==null) ? `<p class="pathread">${t('pathRead',{a:cn(r.trigger),b:cn(r.act),c:cn(r.back)})}</p>` : `<p class="pathread open">${t('pathOpen')}</p>`;
      h += `<div class="lanepanel" style="grid-column:${pc}"><div class="lp-h">${t('exN',{n:k+1})}</div>
        <label>${t('rTrig')}<select data-chg="lane" data-k="${k}" data-f="trigger">${opts(ti===null?null:r.trigger, t('chooseTrig'))}</select></label>
        <label>${t('rBack')}<select data-chg="lane" data-k="${k}" data-f="back">${opts(bi===null?null:r.back, t('chooseBack'))}</select></label>
        ${stale?`<p class="stale">${ico('info','s')} ${t('laneStale')}</p>`:read}</div>`;
    }
    const row = rowOf(k,col); laneHTML[row] = (laneHTML[row]||'') + h;
  });
  Object.keys(laneHTML).sort().forEach(row=>{ h0 += `<div class="mrow rrow ${edit?'edit':''}">${laneHTML[row]}</div>`; });
  if(edit) h0 += `<div class="exhelp">${ico('info')}<div><p>${t('exHelp')}</p><ol>${t('exHelpList').map(x=>`<li>${x}</li>`).join('')}</ol><p class="exex">${t('exExample')}</p></div></div></div>`;
  h = h0;
  return h + `<svg class="wires" aria-hidden="true"></svg></div>`;
}
function cardHTML(id,o,{slot,node,lane,ti}){
  const c = CARDS[id], d = o.dept[id], edit = o.mode==='edit';
  const cls = ['mc', d?'owned':'', (o.sel===id)?'sel':'', ...((o.flags&&o.flags[id])||[])];
  let attrs = node!==undefined ? ` data-node="${node}"` : '';
  if(edit){ cls.push('drag'); attrs += ` draggable="true" data-drag="${slot}" data-drop="${slot}" data-act="slot" data-s="${slot}" tabindex="0" role="button" aria-pressed="${o.sel===id}"`; }
  if(o.clickAct){ cls.push('clk','pick'); attrs += ` data-act="${o.clickAct}" data-v="${id}" tabindex="0" role="button"`; }
  let inner = '';
  if(lane) inner += ti!==null && ti!==undefined ? `<div class="cap">${tx(CARDS[lane.trigger].decision)} <b>${t('no')}</b></div>` : `<div class="cap muted">${t('noTrig')}</div>`;
  inner += `<div class="tt">${tx(c.title)}</div>`;
  if(edit){
    inner += `<label class="ownsel"><span>${t('ownerLbl')}</span><select class="dsel" data-chg="dept" data-card="${id}"><option value="">${t('deptChoose')}</option>${DEPTS.map(k=>`<option value="${k}" ${d===k?'selected':''}>${dn(k)}</option>`).join('')}</select></label>`;
  } else {
    inner += `<div class="own">${ico('user','s')}${d?dn(d):t('ownerNone')}</div>`;
  }
  if(o.extra && o.extra[id]) inner += o.extra[id];
  return `<div class="${cls.join(' ')}"${attrs}>${inner}</div>`;
}
function slotHTML(s,o,node){
  const edit = o.mode==='edit', armed = state.armed===s, isEx = s[0]==='r';
  if(!edit) return `<div class="slot view"${node!==null?` data-node="${node}"`:''}>${t('emptyView')}</div>`;
  return `<div class="slot ${isEx?'exslot':''} ${armed?'armed':''}"${node!==null?` data-node="${node}"`:''} data-drop="${s}" data-act="slot" data-s="${s}" tabindex="0" role="button">${armed?t('placeArmed'):(isEx?t('exSlot'):t('placeHere'))}</div>`;
}
function drawWires(){
  document.querySelectorAll('[data-map]').forEach(map=>{
    const svg = map.querySelector('svg.wires'); if(!svg) return;
    const R = map.getBoundingClientRect();
    svg.setAttribute('viewBox',`0 0 ${R.width} ${R.height}`); svg.setAttribute('width',R.width); svg.setAttribute('height',R.height);
    const rel = el => { const r=el.getBoundingClientRect(); return {l:r.left-R.left, r:r.right-R.left, t:r.top-R.top, b:r.bottom-R.top, cx:(r.left+r.right)/2-R.left, cy:(r.top+r.bottom)/2-R.top}; };
    const nodesEl = [...map.querySelectorAll('.mainrow > [data-node]')], nodes = nodesEl.map(rel);
    let s = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#080928"/></marker>
      <marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA8BE"/></marker>
      <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9780F"/></marker></defs>`;
    const yesAfter = new Set();
    map.querySelectorAll('.rcell').forEach(c=>{ if(c.dataset.trig!=='') yesAfter.add(+c.dataset.trig); });
    for(let k=0;k<nodes.length-1;k++){
      const a=nodes[k], b=nodes[k+1], ltr = b.cx > a.cx;
      const x1 = ltr ? a.r+3 : a.l-3, x2 = ltr ? b.l-3 : b.r+3, y = a.cy;
      const empty = nodesEl[k].classList.contains('slot') || nodesEl[k+1].classList.contains('slot');
      s += `<line class="mainarrow" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${empty?'#9AA8BE':'#080928'}" stroke-width="2" ${empty?'stroke-dasharray="4 4"':''} marker-end="url(#${empty?'ahl':'ah'})"/>`;
      if(yesAfter.has(k-1)) s += `<text x="${(x1+x2)/2}" y="${y-8}" text-anchor="middle" fill="#080928">${t('yes')}</text>`;
    }
    map.querySelectorAll('.rcell').forEach(cell=>{
      if(cell.dataset.trig==='') return;
      const ti = +cell.dataset.trig, trig = nodes[ti+1], card = cell.firstElementChild; if(!trig||!card) return;
      const lane = +cell.dataset.lane, rc = rel(card), xd = trig.cx - 18;
      s += `<path class="downwire" data-lane="${lane}" d="M${xd} ${trig.b+3} V${rc.t-3}" stroke="#C9780F" stroke-width="2" fill="none" marker-end="url(#aha)"/>`;
      s += `<text x="${xd-6}" y="${trig.b+26}" text-anchor="end" fill="#C9780F">${t('no')}</text>`;
      if(cell.dataset.back!==''){
        const bi = +cell.dataset.back, back = nodes[bi+1];
        if(bi===ti) s += `<path class="upwire" data-lane="${lane}" d="M${trig.cx+18} ${rc.t-3} V${trig.b+3}" stroke="#C9780F" stroke-width="2" fill="none" marker-end="url(#aha)"/>`;
        else { const ly = trig.b + 16 + lane*9;
          s += `<path class="upwire" data-lane="${lane}" d="M${rc.cx+18} ${rc.t-3} V${ly} H${back.cx+18} V${back.b+3}" stroke="#C9780F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#aha)"/>`; }
      }
    });
    svg.innerHTML = s;
  });
}

function saveRisk(){
  const dr = state.draft; if(!dr) return;
  if(!dr.cat){ state.note='chooseCat'; render(); return; }
  if(state.risks.some(r=>r.card===dr.card && r.cat===dr.cat && r.id!==dr.id)){ state.note='dup'; render(); return; }
  if(dr.id){ const i = state.risks.findIndex(r=>r.id===dr.id); state.risks[i] = {...dr}; }
  else state.risks.push({...dr, id:'r'+(state.rseq++)});
  state.draft=null; state.note=null; render();
}

  F:{en:'Quality found the error, so this check worked. The rework started from problems in earlier steps.',ar:'الجودة اكتشفت الخطأ، أي أن هذا الفحص نجح. إعادة العمل سببها مشاكل في Steps سابقة.'},
  H:{en:'The customer was told within an hour of approval. The evidence shows no weakness here.',ar:'تم إبلاغ العميل خلال ساعة من الموافقة، والأدلة لا تُظهر ضعفًا هنا.'},
  Dmissing:{en:'At this step the reference was not missing: the customer sent it, and then it was typed wrongly.',ar:'في هذه الـ Step لم يكن الرقم ناقصًا: العميل أرسله، ثم كُتب بشكل خطأ.'},
  Cmissing:{en:'This check did find the missing reference. The weakness came later, when it passed a filled field without checking the number.',ar:'هذا الفحص اكتشف فعلًا الرقم الناقص. الضعف جاء بعد ذلك، عندما قبل خانة ممتلئة دون التأكد من الرقم.'},
  other:{en:'The evidence points to a different type of risk at this step: {c}.',ar:'الأدلة تشير إلى نوع مختلف من الـ Risk عند هذه الـ Step: {c}.'}
};
function evaluate(){
  const m = M(), main = m.main, unlocked = new Set(unlockedDocs());
  const exCards = m.ret.map(r=>r.act).filter(Boolean);
  const isRefMain = id => REF.main.includes(id);
  /* main flow, position by position */
  const mainReview = REF.main.map((ref,i)=>({i, ref, mine:main[i],
    st: main[i]===ref ? 'ok' : main.includes(ref) ? 'moved' : exCards.includes(ref) ? 'asex' : 'missing'}));
  const extraInMain = main.filter(id=>id && !isRefMain(id));
  const posFlag = new Set([...main.filter((id,i)=>id && id!==REF.main[i]), ...exCards.filter(isRefMain)]);
  const placed = mapCards();
  const wrongOwn = placed.filter(id=>m.dept[id]!==CARDS[id].dept);
  /* exception paths */
  const eret = effRet();
  const loopRes = REF.loops.map(L=>{
    const r = eret.find(x=>x.act===L.act);
    if(!r) return {L, st: main.includes(L.act)?'inmain':'missing'};
    if(!r.trigger || !r.back) return {L, st:'incomplete', r};
    if(r.trigger===L.trigger && L.back.includes(r.back)) return {L,st:'ok',r};
    if(r.trigger===L.trigger && L.equiv && L.equiv.includes(r.back)) return {L,st:'equiv',r};
    if(r.trigger===L.trigger && L.discuss && L.discuss.includes(r.back)) return {L,st:'discuss',r};
    return {L,st:'partial',r};
  });
  /* other exception lanes that hold main-flow cards */
  const otherLanes = eret.filter(r=>r.act && isRefMain(r.act));
  /* risks */
  const riskEval = state.risks.map(pr=>{
    const ref = [...REF_RISKS, EXTRA_RISK].find(r=>r.card===pr.card && r.cats.includes(pr.cat));
    if(ref){
      const strong = pr.ev.filter(e=>ref.strong.includes(e)), partial = pr.ev.filter(e=>ref.partial.includes(e));
      return {pr, ref, st: strong.length?'supported':partial.length?'partial':pr.verify?'verify':'unsupported', strong};
    }
    let reason;
    if(pr.card==='D' && pr.cat==='missing') reason = DISCUSS.Dmissing;
    else if(pr.card==='C' && pr.cat==='missing') reason = DISCUSS.Cmissing;
    else if(DISCUSS[pr.card]) reason = DISCUSS[pr.card];
    else { const cats=[...new Set(REF_RISKS.filter(r=>r.card===pr.card).flatMap(r=>r.cats))]; reason = bi(lg=>DISCUSS.other[lg].replace('{c}', joinL(cats.map(c=>catn(c,lg)),lg))); }
    return {pr, ref:null, st:'discuss', reason};
  });
  const missedRisks = REF_RISKS.filter(R=>!riskEval.some(x=>x.ref===R));
  const usedDocs = new Set(riskEval.filter(x=>x.ref && x.st!=='supported').map(x=>x.ref.confirm));
  const docTips = Object.keys(DOC_SHOWS).filter(d=>!unlocked.has(d) && !usedDocs.has(d)).sort((a,b)=>DOC_SHOWS[b].w-DOC_SHOWS[a].w).slice(0,3);
  return {mainReview, extraInMain, posFlag, wrongOwn, loopRes, otherLanes, riskEval, missedRisks, docTips,
    mainOk: mainReview.filter(x=>x.st==='ok').length};
}

/* ===================== stage 4: results ===================== */
const REF_RET = [{trigger:'C',act:'D',back:'C'},{trigger:'F',act:'G',back:'F'}];
const REF_DEPT = Object.fromEntries(Object.keys(CARDS).map(k=>[k,CARDS[k].dept]));
const chip = (cls, txt) => `<span class="rchip ${cls}">${txt}</span>`;
const STCLS = {ok:'ok', moved:'warn', asex:'bad', missing:'bad', equiv:'ok', discuss:'warn', partial:'warn', incomplete:'warn', inmain:'bad', supported:'ok', verify:'warn', unsupported:'warn'};
function s4HTML(){
  const lg = LG(), E = evaluate(), m = M();
  const anim = !state.animDone; state.animDone = true;
  const tot = {q1:0,q2:0,cust:0,other:0}; SEGMENTS.forEach(s=>tot[s.cat]+=s.to-s.from);
  const pct = x => x/TOTAL_MIN*100;
  const segs = SEGMENTS.map((s,i)=>{ const w=s.to-s.from; return `<div class="sg ${s.cat}" style="flex:${w} 1 0;animation-delay:${i*0.13}s" title="${esc(CATS_TIME[s.cat].name[lg])}: ${dur(w,lg)}">${w>=600?`<span>${dur(w,lg)}</span>`:''}</div>`; }).join('');
  const axis = [{d:'mon',at:0},{d:'tue',at:900},{d:'wed',at:2340}].map(x=>`<span class="day" style="inset-inline-start:${pct(x.at)}%">${DAY[x.d][lg]}</span>`).join('');
  const legend = ['q1','q2','cust','other'].map(k=>`<div class="lg ${CATS_TIME[k].hot?'hot':''}"><i style="background:${CATS_TIME[k].color}"></i><b>${dur(tot[k],lg)}</b><span>${CATS_TIME[k].name[lg]}</span><small>${CATS_TIME[k].range[lg]}</small></div>`).join('');

  /* correct / my map */
  const riskW = `<span class="mk">${ico('alert','s')}Risk</span>`;
  const refExtra = {A:`<div class="mks">${riskW}</div>`,
    B:`<span class="wait">${ico('clock','s')}${dur(1395,lg)}</span><div class="mks">${riskW}</div>`,
    C:`<div class="mks">${riskW}</div>`,
    D:`<span class="wait ext">${ico('clock','s')}${dur(130,lg)}</span><div class="mks">${riskW}</div>`,
    G:`<span class="wait">${ico('clock','s')}${dur(1145,lg)}</span><div class="mks">${riskW}</div>`};
  let mapBlock;
  if(state.rview==='actual'){
    mapBlock = `<div class="mapwrap">${mapHTML({main:REF.main, ret:REF_RET, dept:REF_DEPT, mode:'view', clickAct:'rcard', sel:state.rcard, extra:refExtra})}</div><div class="skipnote">${ico('info')}<span>${t('skip')}</span></div>`;
  } else {
    const flags={}, extra={};
    mapCards().forEach(id=>{ const f=[],tags=[];
      if(E.posFlag.has(id)){ f.push('f-pos'); tags.push(`<span class="flag">${t('fPos')}</span>`); }
      if(E.wrongOwn.includes(id)){ f.push('f-own'); tags.push(`<span class="flag">${t('should',{d:dn(CARDS[id].dept)})}</span>`); }
      flags[id]=f; extra[id]=tags.join(''); });
    mapBlock = `<div class="mapwrap">${mapHTML({main:m.main, ret:m.ret, dept:m.dept, mode:'view', clickAct:'rcard', sel:state.rcard, flags, extra})}</div>`;
  }
  const c = state.rcard, C = CARDS[c], unlocked = new Set(unlockedDocs());
  const risksHere = [...REF_RISKS, EXTRA_RISK].filter(r=>r.card===c);
  const evIds = [...new Set(risksHere.length ? risksHere.flatMap(r=>r.strong) : CARD_DOCS[c])];
  const det = `<div class="panel cdet" aria-live="polite"><div class="hd"><h4>${cn(c)}</h4><span class="own">${dn(C.dept)}</span></div>
    <div><h5>${t('what')}</h5><p>${tx(C.happened)}</p></div>
    <div>${risksHere.length?`<h5>${t('riskAt')}</h5>`+risksHere.map(r=>`<div class="rbox"><b>${r.name[lg]}</b><p>${r.text[lg]}</p></div>`).join(''):''}</div>
    <div><h5>${t('evid')}</h5>${evIds.map(e=>`<div class="evrow"><span>${docn(e)}</span>${unlocked.has(e)?`<span class="y">${ico('check','s')} ${t('found')}</span>`:`<span class="n">${t('notFound')}</span>`}</div>`).join('')}</div></div>`;

  /* 1. main flow review */
  const mrows = E.mainReview.map(x=>`<li><span class="pos">${x.i+1}</span><div class="mrc"><b>${cn(x.ref)}</b><small>${t('mrYours')}: ${x.mine?cn(x.mine):t('emptyView')}</small></div>${chip(STCLS[x.st], t('mst')[x.st])}</li>`).join('');
  const extras = E.extraInMain.map(id=>`<p class="rnote bad">${ico('alert','s')} ${t('mrExtra',{c:qn(cn(id),lg)})}</p>`).join('');
  const ownLine = E.wrongOwn.length ? `<p class="rnote warn">${ico('user','s')} ${t('ownDiff',{n:E.wrongOwn.length})} ${joinL(E.wrongOwn.map(id=>`${cn(id)}: ${dn(CARDS[id].dept)}`),lg)}</p>` : `<p class="rnote ok">${ico('check','s')} ${t('ownOk')}</p>`;

  /* 2. exception path review */
  const pathTxt = (a,b,c) => t('correctPath',{a:cn(a),b:cn(b),c:cn(c)});
  const erows = E.loopRes.map((l,k)=>{
    const L=l.L;
    const mine = (l.r && l.r.trigger && l.r.back) ? pathTxt(l.r.trigger, L.act, l.r.back) : (t('lnote')[l.st]||'');
    const note = (l.st==='equiv'||l.st==='discuss') ? `<p class="rnote warn">${t('lnote')[l.st]}</p>` : '';
    return `<div class="excard"><div class="exhd"><h4>${ico('ret','s')} ${t('exN',{n:k+1})}: ${cn(L.act)}</h4>${chip(STCLS[l.st], t('lst')[l.st])}</div>
      <dl><dt>${t('erCorrect')}</dt><dd><b>${pathTxt(L.trigger, L.act, L.back[0])}</b></dd>
      <dt>${t('erYours')}</dt><dd>${mine}</dd>
      <dt>${t('erWhy')}</dt><dd>${LOOP_WHY[L.id][lg]}</dd></dl>${note}</div>`;
  }).join('');

  /* 3. key risks */
  const mine = E.riskEval.length ? E.riskEval.map(x=>{
    const why = x.ref ? (x.st==='supported' ? t('stWhy').supported : t('stWhy')[x.st].replace('{doc}', docn(x.ref.confirm))) : x.reason[lg];
    return `<li><div><b>${x.ref?x.ref.name[lg]:catn(x.pr.cat)}</b> <span class="at">${cn(x.pr.card)}</span><small>${why}</small></div>${chip(STCLS[x.st]||'warn', t('st')[x.st])}</li>`; }).join('')
    : `<li class="none">${t('rkNone')}</li>`;
  const missed = E.missedRisks.length ? E.missedRisks.map(R=>`<li><div><b>${R.name[lg]}</b> <span class="at">${cn(R.card)}</span><small>${R.text[lg]}</small></div></li>`).join('') : `<li class="none">${t('rkAll')}</li>`;
  const tips = E.docTips.length ? `<div class="tips"><h5>${ico('doc','s')} ${t('rkDocs')}</h5><ul>${E.docTips.map(d=>`<li><b>${docn(d)}</b>: ${DOC_SHOWS[d][lg]}</li>`).join('')}</ul></div>` : '';

  return `<section class="results">
  <div class="rv-hero"><div><h2>${t('s4t')}</h2><p>${t('s4s')}</p></div>
    <div class="trio"><div><b>${dur(1440,lg)}</b><span>${t('committed')}</span></div><div><b>${dur(3060,lg)}</b><span>${t('actual')}</span></div><div class="ov"><b>${dur(1620,lg)}</b><span>${t('overrun')}</span></div></div></div>
  <div class="panel tl"><h3 class="rh">${t('bd')}</h3>
    <div class="bar ${anim?'anim':''}" role="img" aria-label="${esc(t('bd'))}">${segs}<div class="sla" style="inset-inline-start:${pct(SLA_MIN)}%"><span>${t('sla')}</span></div></div>
    <div class="axis">${axis}</div><div class="legend">${legend}</div>
    <div class="keyrev"><span class="big">${dur(tot.q1+tot.q2,lg)}</span><p>${t('rev')}</p><small>${t('revC')}</small></div>
    <p class="slafact">${t('slaFact')}</p></div>

  <div class="sec"><h3>${t('mapS')}<span class="seg" role="group"><button data-act="rview" data-v="actual" aria-pressed="${state.rview==='actual'}">${t('act')}</button><button data-act="rview" data-v="mine" aria-pressed="${state.rview==='mine'}">${t('myMap')}</button></span></h3>
    <p class="note" style="margin:-4px 0 10px">${t('clickHint')}</p><div class="mapgrid"><div>${mapBlock}</div>${det}</div></div>

  <div class="rgrid2">
    <div class="panel rsec" id="mainReview"><h3 class="rh"><span class="num">1</span>${t('mrT')}</h3><p class="lead">${t('mrSum',{n:E.mainOk})}</p><ol class="mrl">${mrows}</ol>${extras}${ownLine}</div>
    <div class="panel rsec" id="exReview"><h3 class="rh"><span class="num">2</span>${t('erT')}</h3>${erows}</div>
  </div>
  <div class="panel rsec" id="riskReview"><h3 class="rh"><span class="num">3</span>${t('rkT')}</h3>
    <div class="rk2"><div><h5>${t('rkMine')}</h5><ul class="rkl">${mine}</ul></div><div><h5>${t('rkMissed')}</h5><ul class="rkl">${missed}</ul></div></div>${tips}</div>
  <div class="panel rsec" id="opReview"><h3 class="rh"><span class="num">4</span>${t('opT')}</h3><ul class="opl">${t('opPts').map(p=>`<li>${p}</li>`).join('')}</ul></div>

  <div class="closing"><div><p>${t('close1')}</p><ol>${t('close2').map(x=>`<li><b>${ico('check','s')}</b> ${x}</li>`).join('')}</ol></div>
    <div>${state.confirm==='restart'?`<div class="row"><span style="max-width:22ch">${t('restartQ')}</span><button class="btn btn-p" data-act="restartYes">${t('restartYes')}</button><button class="btn restart btn-s" data-act="cnone">${t('cancel')}</button></div>`:`<button class="btn btn-s restart" data-act="restart">${t('restart')}</button>`}</div></div>
  </section>`;
}

/* ===================== render & events ===================== */
function render(){
  document.documentElement.lang = state.lang; document.documentElement.dir = state.lang==='ar'?'rtl':'ltr';
  document.title = t('title') + ' | Skills Bank';
  $('#hdr').innerHTML = headerHTML();
  $('#main').innerHTML = [welcomeHTML,s1HTML,s2HTML,s3HTML,s4HTML][state.stage]();
  renderDrawer(); save();
  requestAnimationFrame(drawWires);
}
function goStage(n){ $('#toast').classList.remove('show'); state.stage=n; state.maxStage=Math.max(state.maxStage,n); state.confirm=null; state.note=null; state.sel=null; state.armed=null; render(); window.scrollTo({top:0}); }

document.addEventListener('click', e=>{
  if(e.target.closest('select,input,label')) return;
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v, m = M();
  switch(a){
    case 'lang': state.lang=v; render(); break;
    case 'nav': { const i=+el.dataset.i; if(i===2) m.view='edit'; goStage(i); break; }
    case 'start': goStage(1); break;
    case 'dept': state.dept=v; state.selQ=null; render(); break;
    case 'selq': if(state.asked.includes(v)){ state.viewQ=v; state.selQ=null; } else { state.selQ=v; } render(); break;
    case 'ask': askQuestion(); break;
    case 'toS2': goStage(2); break;
    case 'drawer': state.drawer.open=true; state.drawer.doc=null; renderDrawer(); save(); setTimeout(()=>{const b=$('#drawer .dhead button'); b&&b.focus();},50); break;
    case 'dclose': state.drawer.open=false; renderDrawer(); save(); break;
    case 'dtab': state.drawer.tab=v; state.drawer.doc=null; renderDrawer(); save(); break;
    case 'dback': state.drawer.doc=null; renderDrawer(); save(); break;
    case 'opendoc': state.drawer.open=true; state.drawer.tab='docs'; state.drawer.doc=v; renderDrawer(); save(); break;
    case 'tray': placeFromTray(v, null); break;
    case 'slot': { const s=el.dataset.s, id=getS(s), from=state.sel&&whereIs(state.sel);
      if(from){ if(from===s){ state.sel=null; render(); } else moveSlot(from, s); }
      else if(id){ state.sel=id; state.armed=null; render(); }
      else { state.armed = state.armed===s?null:s; render(); }
      break; }
    case 'desel': state.sel=null; state.armed=null; render(); break;
    case 'mv': { const f=whereIs(state.sel); if(f&&f[0]==='m'){ const j=+f.split(':')[1]+(+v); if(j>=0&&j<6) moveSlot(f,'m:'+j); } break; }
    case 'rm': { const f=whereIs(state.sel); if(f) toTray(f); break; }
    case 'conf': snap(); if(v) m.conf[state.sel]=v; else delete m.conf[state.sel]; render(); break;
    case 'undo': if(state.undo.length){ state.map = JSON.parse(state.undo.pop()); state.sel=null; render(); } break;
    case 'reset': state.confirm='reset'; render(); break;
    case 'resetYes': snap(); state.map.main=[null,null,null,null,null,null]; state.map.dept={}; state.map.conf={}; state.map.ret=[{trigger:null,act:null,back:null},{trigger:null,act:null,back:null}]; state.map.view='edit'; state.armed=null; state.confirm=null; state.sel=null; render(); break;
    case 'cnone': state.confirm=null; render(); break;
    case 'how': state.how=!state.how; render(); break;
    case 'review': m.view='review'; state.sel=null; state.armed=null; state.confirm=null; render(); window.scrollTo({top:0}); break;
    case 'editmap': m.view='edit'; state.confirm=null; render(); break;
    case 'submit': submitMap(false); break;
    case 'submitForce': submitMap(true); break;
    case 'pickcard': state.draft={id:null, card:v, cat:null, ev:[], verify:false}; state.note=null; render(); break;
    case 'cat': if(state.draft){ state.draft.cat=v; state.note=null; render(); } break;
    case 'saverisk': saveRisk(); break;
    case 'cancelrisk': state.draft=null; state.note=null; render(); break;
    case 'editrisk': { const r=state.risks.find(x=>x.id===v); if(r){ state.draft=JSON.parse(JSON.stringify(r)); state.note=null; render(); } break; }
    case 'rmrisk': state.risks=state.risks.filter(x=>x.id!==v); if(state.draft&&state.draft.id===v) state.draft=null; render(); break;
    case 'backS2': m.view='edit'; goStage(2); break;
    case 'reveal': if(state.risks.length<3){ state.confirm='reveal'; render(); } else { state.revealed=true; state.draft=null; goStage(4); } break;
    case 'revealForce': state.revealed=true; state.draft=null; goStage(4); break;
    case 'rview': state.rview=v; render(); break;
    case 'rcard': state.rcard=v; render(); break;
    case 'details': state.details=!state.details; render(); break;
    case 'restart': state.confirm='restart'; render(); break;
    case 'restartYes': { const lang=state.lang; state=fresh(); state.lang=lang; render(); window.scrollTo({top:0}); break; }
  }
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-chg]'); if(!el) return;
  const m = M(), k = el.dataset.chg;
  if(k==='dept'){ snap(); if(el.value) m.dept[el.dataset.card]=el.value; else delete m.dept[el.dataset.card]; render(); }
  else if(k==='lane'){ snap(); m.ret[+el.dataset.k][el.dataset.f]=el.value||null; render(); }
  else if(k==='ev' && state.draft){ const s=new Set(state.draft.ev); el.checked?s.add(el.value):s.delete(el.value); state.draft.ev=[...s]; save(); }
  else if(k==='verify' && state.draft){ state.draft.verify=el.checked; save(); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && state.drawer.open){ state.drawer.open=false; renderDrawer(); save(); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-act]:not(button)')){ e.preventDefault(); e.target.click(); }
});
/* drag and drop */
let dragSrc = null;
document.addEventListener('dragstart', e=>{ const el=e.target.closest('[data-drag]'); if(!el) return; dragSrc=el.dataset.drag; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',dragSrc);}catch(_){} });
document.addEventListener('dragover', e=>{ const el=e.target.closest('[data-drop]'); if(!el||!dragSrc) return; e.preventDefault(); document.querySelectorAll('.dropok').forEach(x=>x!==el&&x.classList.remove('dropok')); el.classList.add('dropok'); });
document.addEventListener('dragleave', e=>{ const el=e.target.closest('[data-drop]'); if(el && !el.contains(e.relatedTarget)) el.classList.remove('dropok'); });
document.addEventListener('dragend', ()=>{ dragSrc=null; document.querySelectorAll('.dropok').forEach(x=>x.classList.remove('dropok')); });
document.addEventListener('drop', e=>{
  const el = e.target.closest('[data-drop]'); if(!el||!dragSrc) return; e.preventDefault();
  const dragSrc0 = dragSrc, [sk,sv] = dragSrc.split(':'); dragSrc=null;
  const src = dragSrc0, dst = el.dataset.drop;
  if(sk==='tray' && dst!=='tray') placeFromTray(sv, dst);
  else if(sk!=='tray' && dst!=='tray') moveSlot(src, dst);
  else if(sk!=='tray' && dst==='tray') toTray(src);
});
let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(drawWires,80); });
$('#scrim').addEventListener('click', ()=>{ state.drawer.open=false; renderDrawer(); save(); });

/* integrity check of the time model */
(function(){ const s=SEGMENTS.reduce((a,x)=>a+(x.to-x.from),0); if(s!==TOTAL_MIN || SEGMENTS[0].from!==0 || SEGMENTS.some((x,i)=>i&&x.from!==SEGMENTS[i-1].to)) console.error('Time model inconsistent'); })();
window.PS = {get state(){return state;}, evaluate, render};
render();

</script>
